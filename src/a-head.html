<title>ORISTAR Nội Bộ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
/* Bố cục: thanh điều hướng xanh đậm bên trái, thanh công cụ và bảng dữ liệu bên phải, giống phần mềm kế toán dạng bảng. Điện thoại: thanh trái thành ngăn kéo. */
:root{
  --bg:#edf1f6;--surface:#ffffff;--ink:#1a2a3b;--muted:#5d7084;--line:#d3dce8;
  --brand:#0d6ebd;--brand-ink:#ffffff;--brand-soft:#e0edf9;
  --nav:#0f2a47;--nav-ink:#c9dbee;--nav-hi:#17395f;--nav-line:#23476f;
  --th:#e4edf8;--zebra:#f6f9fc;--hover:#eaf3fc;
  --bad:#b3322b;--bad-soft:#f8e2df;--warn:#8f5405;--warn-soft:#faecd0;--ok:#1d6b3f;--ok-soft:#dcefe4;--note:#34507f;--note-soft:#e3ebf6;
  --x-bg:#d9eee2;--x-fg:#14532d;--n-bg:#e6efd0;--n-fg:#3f5d12;--p-bg:#dbe6fb;--p-fg:#1f3f8f;--o-bg:#f6e0e0;--o-fg:#8f2323;--k-bg:#ebe6dd;--k-fg:#5a4a2e;--l-bg:#f7e5b8;--l-fg:#7a4f05;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1520;--surface:#142130;--ink:#e2ebf4;--muted:#92a6ba;--line:#26384c;
  --brand:#4ea3ec;--brand-ink:#06223d;--brand-soft:#173a5c;
  --nav:#091827;--nav-ink:#b9cde2;--nav-hi:#12304f;--nav-line:#1c3a5a;
  --th:#1a2e44;--zebra:#111d2b;--hover:#193048;
  --bad:#f08a82;--bad-soft:#3b1f1d;--warn:#f0bb68;--warn-soft:#3a2b10;--ok:#7fd3a2;--ok-soft:#173326;--note:#9db8e6;--note-soft:#1c2a40;
  --x-bg:#173326;--x-fg:#8fe0b0;--n-bg:#27331a;--n-fg:#c5de8e;--p-bg:#1b2a4a;--p-fg:#a9c1f5;--o-bg:#3b1f1f;--o-fg:#f4a3a3;--k-bg:#2f2b24;--k-fg:#d8c9a8;--l-bg:#3a2f12;--l-fg:#f2cd7a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1520;--surface:#142130;--ink:#e2ebf4;--muted:#92a6ba;--line:#26384c;
  --brand:#4ea3ec;--brand-ink:#06223d;--brand-soft:#173a5c;
  --nav:#091827;--nav-ink:#b9cde2;--nav-hi:#12304f;--nav-line:#1c3a5a;
  --th:#1a2e44;--zebra:#111d2b;--hover:#193048;
  --bad:#f08a82;--bad-soft:#3b1f1d;--warn:#f0bb68;--warn-soft:#3a2b10;--ok:#7fd3a2;--ok-soft:#173326;--note:#9db8e6;--note-soft:#1c2a40;
  --x-bg:#173326;--x-fg:#8fe0b0;--n-bg:#27331a;--n-fg:#c5de8e;--p-bg:#1b2a4a;--p-fg:#a9c1f5;--o-bg:#3b1f1f;--o-fg:#f4a3a3;--k-bg:#2f2b24;--k-fg:#d8c9a8;--l-bg:#3a2f12;--l-fg:#f2cd7a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brand)}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.2rem}h3{font-size:1rem}p{margin:0}
.muted{color:var(--muted)}.small{font-size:.82rem}.num{font-variant-numeric:tabular-nums}.r{text-align:right}.c{text-align:center}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
#nav{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:0 0 28px;min-width:0}
.brand{padding:18px 16px 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--nav-line);margin-bottom:6px}
.brand b{display:block;font-family:var(--f-disp);font-size:1.25rem;color:#fff;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.grp{padding:14px 16px 4px max(16px,env(safe-area-inset-left,0px));font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f9cbc}
.mi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--nav-ink);font:inherit;padding:8px 14px 8px max(13px,env(safe-area-inset-left,0px));cursor:pointer}
.mi:hover{background:var(--nav-hi)}
.mi[aria-current="true"]{background:var(--nav-hi);border-left-color:#5db1ff;color:#fff;font-weight:600}
.badge{background:#e5553d;color:#fff;border-radius:99px;font-size:.7rem;font-weight:700;padding:1px 7px}
#main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px 16px;min-height:48px}
.bar h1{font-family:var(--f-body);font-size:1.02rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit}
.bar .who{font-size:.8rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
#burger{display:none;background:transparent;border:1px solid rgba(255,255,255,.5);color:inherit;border-radius:4px;font:inherit;font-weight:700;padding:4px 10px;cursor:pointer}
.scrim{display:none}
#page{padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 16px;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-bottom:0;padding:8px 10px;border-radius:4px 4px 0 0}
.tools .sp{flex:1}.tools input,.tools select{width:auto;min-width:170px;min-height:34px;padding:5px 9px}
.btn{font:inherit;font-weight:600;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:4px;cursor:pointer;min-height:34px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.btn.primary:hover{color:var(--brand-ink);filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:3px 9px;min-height:28px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.btn{display:inline-flex;align-items:center;margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);background:var(--surface);max-height:calc(100vh - 230px)}
.tools+.tbl-wrap{border-radius:0 0 4px 4px}
table.tbl{border-collapse:collapse;width:100%;font-size:.85rem}
.tbl th{position:sticky;top:0;z-index:2;background:var(--th);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:nth-child(even){background:var(--zebra)}
.tbl tbody tr[data-act]{cursor:pointer}.tbl tbody tr[data-act]:hover{background:var(--hover)}
.tbl td.wrapc{white-space:normal;min-width:160px}
.foot{font-size:.8rem;color:var(--muted);padding:6px 2px}
.tbl-empty{background:var(--surface);border:1px dashed var(--line);padding:28px 14px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:14px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-disp);font-size:1.7rem;line-height:1.15;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.stat.bad{border-top-color:var(--bad)}.stat.warn{border-top-color:#d89a2b}.stat.ok{border-top-color:#2e9e5b}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.pill{display:inline-flex;align-items:center;font-size:.75rem;font-weight:600;padding:1px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.note{background:var(--note-soft);color:var(--note)}.pill.none{background:var(--line);color:var(--muted)}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:4px;margin-bottom:6px;flex-wrap:wrap}
.alert.bad{background:var(--bad-soft)}.alert.warn{background:var(--warn-soft)}.alert.note{background:var(--note-soft)}.alert.ok{background:var(--ok-soft)}
.alert .t{min-width:0}.alert .t b{display:block}
.line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}
.line span:first-child{color:var(--muted)}.line span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 10px;width:100%;min-height:38px}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
input[type=file]{padding:6px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.field{min-width:0}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:inline-grid;place-items:center;font-weight:700;overflow:hidden;object-fit:cover}
img.avatar{display:inline-block}.avatar.lg{width:96px;height:96px;font-size:2rem}
.brush{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-weight:700;border:2px solid transparent;border-radius:4px;padding:4px 12px;cursor:pointer;min-width:42px;min-height:34px}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.cX{background:var(--x-bg);color:var(--x-fg)}.cN{background:var(--n-bg);color:var(--n-fg)}.cP{background:var(--p-bg);color:var(--p-fg)}.cO{background:var(--o-bg);color:var(--o-fg)}.cK{background:var(--k-bg);color:var(--k-fg)}.cL{background:var(--l-bg);color:var(--l-fg)}.cE{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
td.mc{padding:0;text-align:center;min-width:30px;font-weight:700;font-size:.78rem;cursor:pointer}
td.mc.off{background:var(--bg)}td.mc.hol{box-shadow:inset 0 0 0 1px var(--l-fg)}
th.dh{text-align:center;padding:4px 2px;min-width:30px;font-size:.72rem}
.stick{position:sticky;left:0;z-index:1;background:var(--surface)}
th.stick{z-index:3;background:var(--th)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:.72rem;font-weight:600;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cell{position:relative;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-height:52px;padding:3px 6px;display:flex;flex-direction:column;justify-content:space-between;font:inherit;color:inherit;text-align:left}
button.cell{cursor:pointer}.cell.empty{border:0;background:transparent}.cell.off{background:var(--bg);color:var(--muted)}
.cell .dn{font-size:.78rem}.cell .cd{align-self:flex-end;font-weight:700;padding:0 6px;border-radius:4px;min-width:22px;text-align:center}
.cell.today{outline:2px solid var(--brand);outline-offset:-2px}.cell.hol{border-color:var(--l-fg)}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{font-style:normal;font-weight:700;padding:0 6px;border-radius:4px;margin-right:4px}
.mnav{display:flex;align-items:center;gap:8px}.mnav b{min-width:112px;text-align:center}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(8,18,30,.58);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px 24px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;width:100%;max-width:680px;padding:16px;margin:auto 0}
.sheet.wide{max-width:900px}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.err{color:var(--bad);font-size:.84rem;margin-top:8px;min-height:1.2em}
.hint{background:var(--note-soft);color:var(--note);border-radius:4px;padding:8px 12px;font-size:.84rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:4px;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty-state{text-align:center;padding:28px 12px}.empty-state h3{margin-bottom:6px}
.scanres{border-radius:6px;padding:18px;text-align:center;margin-top:12px}
.scanres.ok{background:var(--ok-soft);color:var(--ok)}.scanres.bad{background:var(--bad-soft);color:var(--bad)}.scanres.warn{background:var(--warn-soft);color:var(--warn)}
.scanres b{display:block;font-family:var(--f-disp);font-size:1.7rem}
canvas.sig{width:100%;height:150px;background:#fff;border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair}
.qrbox{display:grid;place-items:center;gap:6px;text-align:center}
.steps{display:grid;gap:6px;margin:0;padding-left:20px}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  #nav{position:fixed;left:0;top:0;bottom:0;width:276px;z-index:50;transform:translateX(-102%);transition:transform .2s}
  #nav.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;z-index:45;background:rgba(8,18,30,.5)}
  #burger{display:inline-block}
  .tbl-wrap{max-height:none}
}
/* ===== nhận diện ORISTAR: logo 3D, tiêu đề nổi bật ===== */
.brandrow{display:flex;align-items:center;gap:12px}
.wordmark{font-family:var(--f-body);font-weight:700;font-size:1.28rem;letter-spacing:.2em;background:linear-gradient(95deg,#ffffff,#8fdcff 60%,#ffd97a);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.brand span.sub{display:block;margin-top:3px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.72;color:var(--nav-ink)}
.stage{perspective:640px;flex:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.coin{position:relative;transform-style:preserve-3d;will-change:transform}
.coin .ly{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#0b3f86,#06224d)}
.coin .f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.coin .f svg,.coin .f img{width:100%;height:100%;display:block;object-fit:cover}
.coin .f.bk{transform:rotateY(180deg)}
.bar{background:linear-gradient(100deg,#082f63 0%,#0d6ebd 55%,#13a9c8 100%)}
.bar h1{font-size:1.2rem;letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,0,0,.28)}
.bar .stage{display:none}
#nav{background:linear-gradient(190deg,#0b2447 0%,#0f2a47 45%,#0a1c33 100%)}
.grp{background:linear-gradient(90deg,#8fdcff,#ffd97a);-webkit-background-clip:text;background-clip:text;color:transparent}
.mi{transition:background .15s,padding-left .15s}
.mi:hover{padding-left:calc(max(13px,env(safe-area-inset-left,0px)) + 4px)}
.mi[aria-current="true"]{background:linear-gradient(90deg,rgba(28,99,184,.95),rgba(19,169,200,.35));border-left-color:#ffd97a;box-shadow:inset 0 0 18px rgba(93,177,255,.2)}
.card h3,.sec-h h3{position:relative}
.card h3::after,.sec-h h3::after{content:"";display:block;height:3px;width:36px;margin-top:4px;border-radius:2px;background:linear-gradient(90deg,var(--brand),#13a9c8,#f2b21b)}
.stat{border-top:0;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--brand),#13a9c8)}
.stat.bad::before{background:linear-gradient(90deg,#d9473b,#f08a82)}.stat.warn::before{background:linear-gradient(90deg,#d89a2b,#f5cf6a)}.stat.ok::before{background:linear-gradient(90deg,#2e9e5b,#6fd1a0)}
.pg-in{animation:pgin .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* ===== chat nội bộ ===== */
.chat{display:grid;grid-template-columns:310px minmax(0,1fr);height:calc(100vh - 118px);min-height:420px;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.clist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.clist .hd{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.clist .rows{overflow-y:auto;flex:1}
.crow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;padding:10px;cursor:pointer}
.crow:hover{background:var(--hover)}.crow[aria-current="true"]{background:var(--brand-soft)}
.crow .tx{flex:1;min-width:0}.crow .tx b,.crow .tx span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .tm{font-size:.72rem;color:var(--muted);white-space:nowrap;text-align:right}
.conv{display:flex;flex-direction:column;min-width:0;min-height:0}
.conv .top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--th)}
.conv .top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:12px;background:linear-gradient(180deg,var(--bg),var(--surface));display:flex;flex-direction:column;gap:4px}
.day{align-self:center;font-size:.72rem;color:var(--muted);background:var(--line);border-radius:99px;padding:1px 10px;margin:8px 0}
.msg{max-width:min(78%,520px);display:flex;flex-direction:column;gap:2px}
.msg.me{align-self:flex-end;align-items:flex-end}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 11px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me .bub{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);border-radius:14px 14px 4px 14px}
.bub img{display:block;max-width:100%;max-height:260px;border-radius:8px;cursor:zoom-in}
.msg .meta{font-size:.7rem;color:var(--muted)}
.msg .who2{font-size:.74rem;font-weight:600;color:var(--brand)}
.composer{display:flex;gap:6px;align-items:flex-end;padding:8px;border-top:1px solid var(--line);background:var(--surface)}
.composer textarea{min-height:40px;max-height:120px;height:40px;font-family:var(--f-body);font-size:.92rem;resize:none;flex:1}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:2px;padding:6px;border-top:1px solid var(--line);max-height:132px;overflow-y:auto;background:var(--surface)}
.emo button{border:0;background:transparent;font-size:1.35rem;cursor:pointer;border-radius:6px;padding:3px}.emo button:hover{background:var(--hover)}
.chat .back{display:none}
.unread{background:#e5553d;color:#fff;border-radius:99px;font-size:.68rem;font-weight:700;padding:0 6px;min-width:18px;text-align:center;display:inline-block;margin-top:3px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:.9rem}.chk input{width:auto;min-height:0}
/* ===== khóa màn hình ===== */
#lock{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 30% 20%,#12407f,#06152b 70%);display:grid;place-items:center;padding:20px}
#lock .box{width:min(340px,100%);text-align:center;color:#dbe9f7;display:grid;gap:12px;justify-items:center}
#lock input{text-align:center;letter-spacing:.5em;font-size:1.4rem;max-width:240px}
@media (max-width:899px){
  .bar .stage{display:block}
  .chat{grid-template-columns:minmax(0,1fr);height:calc(100vh - 100px)}
  .chat.opened .clist{display:none}.chat:not(.opened) .conv{display:none}
  .chat .back{display:inline-block}
}
.credit{text-align:center;padding:22px 12px 28px;font-size:.84rem;color:var(--muted)}.credit b{font-weight:800;color:var(--ink)}
.credit .cc{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;border:1.5px solid currentColor;border-radius:50%;font-size:.8em;font-weight:700;line-height:1;margin:0 2px;vertical-align:.05em}
.credit.dark{color:#b9d3ee;padding:6px 0 0}.credit.dark b{color:#fff}
#nav .credit{display:none}
.cT{background:#e4d9fb;color:#3d2490}.cOT{background:#ffe3b8;color:#7a4300}
.otb{display:block;font-size:.62rem;line-height:1;color:#b45f06;font-weight:700}sup.ot{font-size:.6rem;color:#b45f06;margin-left:1px;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cT{background:#3a2d63;color:#d9ccff}:root:not([data-theme="light"]) .cOT{background:#5a3a0e;color:#ffd9a0}:root:not([data-theme="light"]) .otb,:root:not([data-theme="light"]) sup.ot{color:#ffb866}}
:root[data-theme="dark"] .cT{background:#3a2d63;color:#d9ccff}:root[data-theme="dark"] .cOT{background:#5a3a0e;color:#ffd9a0}:root[data-theme="dark"] .otb,:root[data-theme="dark"] sup.ot{color:#ffb866}
@media (prefers-reduced-motion:reduce){#nav,#toast{transition:none}.pg-in{animation:none}}
</style>
